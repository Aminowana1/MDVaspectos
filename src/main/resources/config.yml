# ============================================================
# MDVAspectos - Menu de aspectos por raza
# ============================================================
# Usa /aspecto para abrir el catalogo de la raza actual.
# El plugin detecta la raza con PlaceholderAPI y MMOCore.
#
# Recomendado:
# - PlaceholderAPI instalado.
# - Expansion de MMOCore funcionando.
# - SkinsRestorer instalado con skins guardadas: humano_0, orco_0, elfo_0, etc.
#
# Si SkinsRestorer API no puede cargar la textura de una head, puedes poner
# texture-value manual en cada skin.

settings:
  menu-title: '&8Aspectos: {race_display}'
  menu-size: 54
  class-placeholder: '%mmocore_class_id%'

  # Clases/razas que no pueden abrir /aspecto.
  # Agrega aqui el id real de tu clase default si es distinto.
  no-race-classes:
    - ''
    - 'none'
    - 'null'
    - 'sin_clase'
    - 'sinclase'
    - 'default'

  # Comando ejecutado desde consola al seleccionar aspecto.
  # Variables: {player}, {skin}, {catalog}, {race_display}, {skin_display}
  apply-command: 'skin set {skin} {player}'

  # Si true, intenta usar la API de SkinsRestorer para mostrar las cabezas
  # con las texturas guardadas. Si falla, usa texture-value o una cabeza normal.
  use-skinsrestorer-heads: true

  fill-empty-slots: true
  fill-material: BLACK_STAINED_GLASS_PANE
  fill-name: ' '

# ============================================================
# Memoria de aspecto
# Guarda la skin elegida y la reaplica al entrar.
# Esto protege contra reinicios donde SkinsRestorer/Mojang fallen
# y el jugador vuelva a su skin premium/default.
#
# Tambien escucha comandos de consola tipo:
# skin set humano_0 Aminowana
# Por eso funciona con tus skills random de MythicMobs.
# ============================================================
skin-memory:
  enabled: true

  # Guarda cuando el jugador selecciona una skin desde /aspecto.
  save-from-menu: true

  # Guarda cuando consola ejecuta: skin set <skin> <player>
  # Sirve para MythicMobs: command{c="skin set humano_0 <caster.name>";ac=false}
  listen-console-skin-commands: true

  # Guarda comandos de jugador/admin tipo /skin conan, /skin set conan, /skin set conan Jugador, /skin clear.
  # Seguridad: solo guarda si el jugador tiene los permisos configurados abajo.
  listen-player-skin-commands: true
  player-command-require-permission: true
  player-command-save-permission: 'mdvaspectos.skinmemory.free'
  player-command-required-permissions:
    - 'mdvaspectos.skinmemory.free'
  player-command-save-delay-ticks: 20

  # Si false, tambien recuerda skins fuera del catalogo usadas por consola/admins/jugadores con permiso.
  # Necesario si permites /skin libre y /skin clear fuera del catalogo.
  only-configured-skins: false

  # Al entrar, solo reaplica si la skin guardada pertenece a la raza/catalogo actual.
  # Evita que un jugador orco reciba una skin humana vieja por error.
  require-current-catalog-match: true

  apply-on-join: true
  apply-delay-seconds: 8
  retry-delays-seconds:
    - 20
    - 60
    - 120

  # Comando usado para reaplicar la skin guardada.
  # Variables: {player}, {skin}, {catalog}
  apply-command: 'skin set {skin} {player}'

  debug: false

# ============================================================
# Sello de iniciacion / Race Command Gate
# Bloquea comandos a jugadores que todavia no eligieron raza.
# Si no tienen required-permission, cualquier comando no permitido
# se cancela y se redirige a /raza.
#
# Dale mdvcraft.race.selected al grupo aventurero.
# Dale mdvcraft.racegate.bypass a admins/staff.
# ============================================================
race-command-gate:
  enabled: true
  required-permission: 'mdvcraft.race.selected'
  bypass-permission: 'mdvcraft.racegate.bypass'
  allow-ops: true

  # Java usa este comando como siempre.
  # En Bedrock, MDVAspectos intenta abrir directamente el Form de razas de
  # MDVSocial y solo usa este comando si ese bridge no está disponible.
  redirect-command: 'raza'
  redirect-delay-ticks: 2

  bedrock-redirect:
    enabled: true
    use-mdvsocial: true

  message:
    enabled: true
    text:
      - '&6&l[&5&lMDVCRAFT&6&l]&4> &r&cDebes elegir una raza antes de usar comandos.'
      - '&7Abriendo el selector de raza...'

  # Evita spam de mensajes si el jugador insiste en spamear el libro/carteles/comandos.
  message-cooldown-ms: 1500

  # Bloquea tambien interacciones que no pasan por comando escrito:
  # - Libro del Viajero / item social de MDVSocial
  # - Carteles interactivos como RandomTP
  interactions:
    enabled: true
    block-signs: true
    block-items: true
    blocked-items:
      social-menu-book:
        enabled: true
        material: BOOK
        slot: 8
        name-contains: 'Libro del Viajero'

  allowed-commands:
    - 'raza'
    - 'clase'
    - 'class'
    - 'mmocore:class'
    - 'login'
    - 'l'
    - 'register'
    - 'reg'
    - 'authme:login'
    - 'authme:register'
    - 'premium'
    - 'cracked'
    - 'fastlogin:premium'
    - 'fastlogin:cracked'

  debug: false

# Botones globales que aparecen en todos los catalogos.
# Sirve para volver a MDVSocial u otros menus.
# Puedes usar texture/custom-head-texture/head-texture/skull_texture con Base64 o URL directa.
buttons:
  social-main:
    enabled: true
    slot: 49
    material: COMPASS
    name: '&a&lMenu principal'
    lore:
      - '&7Vuelve al menu principal de MDVSocial.'
      - ''
      - '&eClick para volver.'
    close-on-click: true
    commands:
      - 'social main'

messages:
  prefix: '&6&l[&5&lMDVCRAFT&6&l]&4> &r'
  only-player: '&cEste comando solo puede usarlo un jugador.'
  no-permission: '&cNo tienes permiso para usar este comando.'
  reloaded: '&aMDVAspectos recargado correctamente.'
  no-placeholderapi: '&cNo se pudo detectar tu raza porque PlaceholderAPI no esta disponible.'
  no-race: '&cDebes elegir una raza antes de cambiar tu aspecto. Usa &e/raza&c.'
  no-catalog: '&cTu raza actual no tiene catalogo de aspectos configurado.'
  skin-applied: '&eHas cambiado tu aspecto a &a{skin_display}&e.'
  skin-error: '&cNo se pudo aplicar este aspecto. Avisa a un administrador.'
  skin-memory-empty: '&cNo tienes ningun aspecto guardado todavia.'
  skin-memory-reapplied: '&aReaplicando tu aspecto guardado: &e{skin}&a.'
  skin-memory-native: '&aTienes guardado el estado de skin nativa. No se reaplicara ningun aspecto custom.'

